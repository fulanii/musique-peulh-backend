<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Song Upload</title>
</head>
<body>
  <h1>Upload Song</h1>
  <form action="http://localhost:8000/api/song/upload/" method="post" enctype="multipart/form-data">
    <label for="title">Title:</label><br>
    <input type="text" id="title" name="title"><br><br>

    <label for="artist_name">Artist Name:</label><br>
    <input type="text" id="artist_name" name="artist_name" value="Disco Fils"><br><br>

    <label for="uploaded_by">Uploaded By:</label><br>
    <input type="text" id="uploaded_by" name="uploaded_by" value="Yassine"><br><br>

    <label for="duration">Duration:</label><br>
    <input type="text" id="duration" name="duration" value="2.59"><br><br>

    <label for="upload_by">Uploaded By:</label><br>
    <input type="text" id="upload_by" name="upload_by" value="Hakim"><br><br>

    <label for="audio_file">Audio File:</label><br>
    <input type="file" id="audio_file" name="audio_file"><br><br>

    <label for="cover_image">Cover Image:</label><br>
    <input type="file" id="cover_image" name="cover_image"><br><br>

    <button type="submit">Upload</button>


  </form>

    <script>
      document
        .getElementById("songForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          try {
            const response = await fetch(
              "http://localhost:8000/api/song/upload/",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(data),
              }
            );

            const result = await response.json();
            document.getElementById("result").textContent = JSON.stringify(
              result,
              null,
              2
            );
          } catch (err) {
            document.getElementById("result").textContent = "Error: " + err;
          }
        });
    </script>
</body>
</html>
